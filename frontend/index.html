<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- AUTHENTICATION VIEW (Login & Register) -->
<div id="auth-view" class="container view active">
    <div class="auth-box">
        <div class="auth-tabs">
            <button id="tab-login" class="tab-btn active">Login</button>
            <button id="tab-register" class="tab-btn">Register</button>
        </div>

        <!-- Login Form -->
        <form id="login-form" class="auth-form active">
            <h2>Welcome Back</h2>
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="login-username" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="login-password" required>
            </div>
            <button type="submit" class="btn">Login</button>
            <p id="login-msg" class="msg error-msg"></p>
        </form>

        <!-- Register Form -->
        <form id="register-form" class="auth-form">
            <h2>Create Account</h2>
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="reg-username" required>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="reg-email" required placeholder="user@example.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="reg-password" required>
            </div>
            <div class="form-group">
                <label>Role</label>
                <select id="reg-role" required>
                    <option value="VIEWER">Viewer</option>
                    <option value="ANALYST">Analyst</option>
                    <option value="ADMIN">Admin</option>
                </select>
            </div>
            <button type="submit" class="btn">Sign Up</button>
            <p id="reg-msg" class="msg"></p>
        </form>
    </div>
</div>

<!-- DASHBOARD VIEW -->
<div id="dashboard-view" class="container view">
    <header>
        <h1>My Dashboard</h1>
        <button id="logout-btn" class="btn btn-outline">Logout</button>
    </header>

    <!-- Summary Cards -->
    <div class="summary-cards">
        <div class="card">
            <h3>Total Income</h3>
            <p id="total-income">$0.00</p>
        </div>
        <div class="card">
            <h3>Total Expenses</h3>
            <p id="total-expenses">$0.00</p>
        </div>
        <div class="card">
            <h3>Net Balance</h3>
            <p id="net-balance">$0.00</p>
        </div>
    </div>

    <div class="main-content">
        <!-- Add Transaction Form -->
        <div class="form-section">
            <h3>Add Transaction</h3>
            <form id="transaction-form">
                <div class="form-group">
                    <label>Amount</label>
                    <input type="number" id="amount" step="0.01" min="0" required>
                </div>
                <div class="form-group">
                    <label>Type</label>
                    <select id="type" required>
                        <option value="INCOME">Income</option>
                        <option value="EXPENSE">Expense</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <select id="category" required>
                        <option value="SALARY">Salary</option>
                        <option value="FOOD">Food</option>
                        <option value="RENT">Rent</option>
                        <option value="UTILITIES">Utilities</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Date</label>
                    <input type="date" id="recordDate" required>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <input type="text" id="description">
                </div>
                <button type="submit" class="btn">Add Transaction</button>
                <p id="tx-msg" class="msg"></p>
            </form>
        </div>

        <!-- Recent Transactions Table -->
        <div class="table-section">
            <h3>Recent Transactions</h3>
            <table id="transactions-table">
                <thead>
                <tr>
                    <th>Date</th>
                    <th>Description</th>
                    <th>Category</th>
                    <th>Type</th>
                    <th>Amount</th>
                </tr>
                </thead>
                <tbody id="transactions-body">
                <!-- Rows populated by JS -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
