<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinTrack - Finance Management</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<!-- Loading Spinner & Toast -->
<div id="loader-overlay" class="hidden">
    <div class="spinner"></div>
    <p id="loader-msg">Loading...</p>
</div>
<div id="toast-container"></div>

<!-- PAGE 1: Authentication -->
<div id="auth-page" class="page-container">
    <div class="auth-box">
        <h1>FinTrack</h1>

        <div class="auth-tabs">
            <button id="tab-login" class="active" onclick="switchAuthTab('login')">Login</button>
            <button id="tab-register" onclick="switchAuthTab('register')">Register</button>
        </div>

        <!-- Login Form -->
        <form id="login-form" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="login-username" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="login-password" required>
            </div>
            <button type="submit" class="btn btn-primary">Login</button>
        </form>

        <!-- Register Form -->
        <form id="register-form" class="hidden" onsubmit="handleRegister(event)">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="reg-username" required>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="reg-email" required>
            </div>
            <div class="form-group">
                <label>Company ID</label>
                <input type="number" id="reg-company-id" min="1" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="reg-password" required>
            </div>
            <div class="form-group">
                <label>Role</label>
                <select id="reg-role">
                    <option value="VIEWER">Viewer</option>
                    <option value="ANALYST">Analyst</option>
                    <option value="ADMIN">Admin</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary">Register</button>
        </form>
    </div>
</div>

<!-- PAGE 2: Dashboard Application -->
<div id="app-page" class="page-container hidden">
    <nav class="navbar">
        <div class="brand">FinTrack</div>
        <div class="nav-actions">
            <span id="user-role-badge" class="badge"></span>
            <button onclick="logout()" class="btn btn-danger">Logout</button>
        </div>
    </nav>

    <div class="main-tabs">
        <button id="nav-transactions" class="active" onclick="switchAppTab('transactions')">Transactions</button>
        <button id="nav-analytics" onclick="switchAppTab('analytics')">Dashboard</button>
    </div>

    <div class="app-content">
        <!-- TAB 1: Transactions -->
        <div id="transactions-tab">
            <div class="toolbar">
                <div class="filters">
                    <input type="text" id="search-keyword" placeholder="Search keyword...">
                    <select id="filter-type">
                        <option value="">All Types</option>
                        <option value="INCOME">Income</option>
                        <option value="EXPENSE">Expense</option>
                    </select>
                    <select id="filter-category">
                        <option value="">All Categories</option>
                        <option value="SALARY">Salary</option>
                        <option value="PROFIT">Profit</option>
                        <option value="FOOD">Food</option>
                        <option value="RENT">Rent</option>
                        <option value="UTILITIES">Utilities</option>
                    </select>
                    <input type="date" id="filter-start">
                    <input type="date" id="filter-end">
                    <button onclick="loadTransactions()" class="btn btn-secondary">Filter</button>
                </div>
                <button onclick="openTransactionModal()" class="btn btn-primary admin-only">Add Transaction</button>
            </div>

            <div class="table-responsive">
                <table id="transactions-table">
                    <thead>
                    <tr>
                        <th>Date</th>
                        <th>Type</th>
                        <th>Category</th>
                        <th>Amount</th>
                        <th>Description</th>
                        <th>Actions</th>
                    </tr>
                    </thead>
                    <tbody id="transactions-body"></tbody>
                </table>
            </div>
            <div class="pagination">
                <button onclick="changePage(-1)" id="btn-prev">Previous</button>
                <span id="page-info">Page 1</span>
                <button onclick="changePage(1)" id="btn-next">Next</button>
            </div>
        </div>

        <!-- TAB 2: Dashboard -->
        <div id="analytics-tab" class="hidden">
            <div class="summary-cards">
                <div class="card">
                    <h3>Total Income</h3>
                    <h2 id="sum-income">$0.00</h2>
                </div>
                <div class="card">
                    <h3>Total Expenses</h3>
                    <h2 id="sum-expenses">$0.00</h2>
                </div>
                <div class="card">
                    <h3>Net Balance</h3>
                    <h2 id="sum-balance">$0.00</h2>
                </div>
            </div>

            <div class="charts-container analytics-only">
                <div class="chart-card">
                    <h3>Expenses by Category</h3>
                    <canvas id="categoryChart"></canvas>
                </div>
                <div class="chart-card">
                    <h3>Monthly Profit Trend</h3>
                    <canvas id="monthlyChart"></canvas>
                </div>
            </div>

            <div class="recent-transactions card">
                <h3>Recent Transactions</h3>
                <ul id="recent-list"></ul>
            </div>
        </div>
    </div>
</div>

<!-- Transaction Modal (Add/Edit/View) -->
<div id="transaction-modal" class="modal hidden">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="modal-title">Add Transaction</h2>
            <span class="close" onclick="closeModal('transaction-modal')">&times;</span>
        </div>
        <form id="transaction-form" onsubmit="saveTransaction(event)">
            <input type="hidden" id="tx-id">
            <div class="form-group">
                <label>Amount</label>
                <input type="number" id="tx-amount" step="0.01" min="0" required>
            </div>
            <div class="form-group">
                <label>Type</label>
                <select id="tx-type" required>
                    <option value="INCOME">Income</option>
                    <option value="EXPENSE">Expense</option>
                </select>
            </div>
            <div class="form-group">
                <label>Category</label>
                <select id="tx-category" required>
                    <option value="SALARY">Salary</option>
                    <option value="PROFIT">Profit</option>
                    <option value="FOOD">Food</option>
                    <option value="RENT">Rent</option>
                    <option value="UTILITIES">Utilities</option>
                </select>
            </div>
            <div class="form-group">
                <label>Date</label>
                <input type="date" id="tx-date" required>
            </div>
            <div class="form-group">
                <label>Description</label>
                <textarea id="tx-desc" rows="3"></textarea>
            </div>
            <div class="modal-footer" id="modal-actions">
                <button type="submit" class="btn btn-primary" id="btn-save-tx">Save</button>
                <button type="button" class="btn btn-secondary" onclick="closeModal('transaction-modal')">Cancel</button>
            </div>
        </form>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
